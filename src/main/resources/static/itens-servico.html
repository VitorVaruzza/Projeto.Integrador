<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>try{var t=localStorage.getItem('theme')||'dark';document.documentElement.classList.add('theme-'+t);}catch(e){}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Itens de Serviço</title>
    <style>
        :root {
            --bg: #f3efe8;
            --surface: rgba(255, 250, 245, 0.92);
            --surface-strong: #fff;
            --ink: #1e293b;
            --accent: #8c2f1b;
            --accent-soft: #d9b7a7;
            --ok: #0f766e;
            --danger: #b42318;
            --line: #ead8c6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(140, 47, 27, 0.07), transparent 25%),
                radial-gradient(circle at right top, rgba(15, 118, 110, 0.12), transparent 30%),
                var(--bg);
            min-height: 100vh;
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 18px 64px;
        }

        .header {
            margin-bottom: 24px;
        }

        .eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .12em;
            font-size: .8rem;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: clamp(2rem, 4vw, 3.3rem);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(320px, 420px) 1fr;
            gap: 22px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(30, 41, 59, 0.08);
            backdrop-filter: blur(8px);
        }

        form {
            display: grid;
            gap: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: .92rem;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface-strong);
            font: inherit;
        }

        input:focus {
            outline: 2px solid rgba(140, 47, 27, 0.18);
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button[type="submit"] {
            background: var(--accent);
            color: #fff;
        }

        button[type="button"] {
            background: #efe4dc;
            color: var(--ink);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }

        th, td {
            padding: 14px 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        th {
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #5a6572;
        }

        .table-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .small {
            padding: 8px 12px;
            font-size: .88rem;
        }

        .small.delete {
            background: #fee4e2;
            color: var(--danger);
        }

        .status {
            margin-top: 14px;
            min-height: 24px;
            font-weight: 700;
        }

        .status.ok { color: var(--ok); }
        .status.error { color: var(--danger); }

        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }

            th:nth-child(4),
            td:nth-child(4) {
                display: none;
            }
        }

        .btn-home {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--ink);
            padding: 10px 16px;
            border-radius: 999px;
            text-decoration: none;
            font-size: .88rem;
            font-weight: 700;
            margin-bottom: 24px;
            transition: background .2s ease;
        }

        .btn-home:hover {
            background: var(--accent);
            color: #fff;
        }
    </style>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js" defer></script>
</head>
<body>
<main>
    <a href="/" class="btn-home">← Voltar para o Início</a>
    <button id="theme-toggle" class="btn-home" style="margin-left:8px">Modo Escuro</button>
    <div class="header">
        <div class="eyebrow">Modulo Financeiro</div>
        <h1>Cadastro de itens de serviço</h1>
    </div>

    <section class="layout">
        <article class="panel">
            <h2 id="form-title">Novo item de serviço</h2>
            <form id="item-form">
                <input type="hidden" id="id_item">

                <label>
                    Ordem de Serviço
                    <select id="id_ordem" required>
                        <option value="">Selecione uma ordem...</option>
                    </select>
                </label>

                <label>
                    Serviço
                    <select id="id_servico" required>
                        <option value="">Selecione um serviço...</option>
                    </select>
                </label>

                <label>
                    Quantidade
                    <input id="quantidade" type="number" step="1" min="1" required>
                </label>

                <label>
                    Valor Unitário
                    <input id="valor_unitario" type="number" step="0.01" min="0.01" required>
                </label>

                <div class="actions">
                    <button type="submit">Salvar item</button>
                    <button type="button" id="cancelar">Limpar formulario</button>
                </div>
            </form>
            <div id="status" class="status"></div>
        </article>

        <article class="panel">
            <h2>Itens de serviço cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ordem</th>
                        <th>Serviço</th>
                        <th>Quantidade</th>
                        <th>Valor Unitário</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody id="itens-body"></tbody>
            </table>
        </article>
    </section>
</main>

<script>
    const apiUrl = "/api/itens-servico";
    const form = document.getElementById("item-form");
    const tbody = document.getElementById("itens-body");
    const statusBox = document.getElementById("status");
    const formTitle = document.getElementById("form-title");
    const cancelButton = document.getElementById("cancelar");

    function setStatus(message, type = "ok") {
        statusBox.textContent = message;
        statusBox.className = `status ${type}`;
    }

    function clearStatus() {
        statusBox.textContent = "";
        statusBox.className = "status";
    }

    function formData() {
        return {
            id_os: parseInt(document.getElementById("id_ordem").value),
            id_servico: parseInt(document.getElementById("id_servico").value),
            quantidade: parseInt(document.getElementById("quantidade").value),
            valor_unitario: parseFloat(document.getElementById("valor_unitario").value)
        };
    }

    function resetForm() {
        form.reset();
        document.getElementById("id_item").value = "";
        formTitle.textContent = "Novo item de serviço";
        clearStatus();
    }

    async function loadOrdensDeSevico() {
        try {
            const response = await fetch("/api/ordens-servico");
            const ordens = await response.json();
            const select = document.getElementById("id_ordem");

            // Limpar opções anteriores mantendo a primeira
            while (select.options.length > 1) {
                select.remove(1);
            }

            // Adicionar ordens como opções
            ordens.forEach(ordem => {
                const option = document.createElement("option");
                option.value = ordem.id_os;
                option.textContent = `OS #${ordem.id_os} - ${ordem.status}`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("Erro ao carregar ordens de serviço:", error);
        }
    }

    async function loadServicos() {
        try {
            const response = await fetch("/api/servicos");
            const servicos = await response.json();
            const select = document.getElementById("id_servico");

            // Limpar opções anteriores mantendo a primeira
            while (select.options.length > 1) {
                select.remove(1);
            }

            // Adicionar serviços como opções
            servicos.forEach(servico => {
                const option = document.createElement("option");
                option.value = servico.id_servico;
                option.textContent = `${servico.id_servico} - ${servico.nome} (R$ ${parseFloat(servico.valor).toFixed(2)})`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("Erro ao carregar serviços:", error);
        }
    }

    async function loadItens() {
        const response = await fetch(apiUrl);
        const itens = await response.json();

        tbody.innerHTML = "";
        itens.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${item.id_item}</td>
                <td>${item.id_os}</td>
                <td>${item.id_servico}</td>
                <td>${item.quantidade}</td>
                <td>R$ ${parseFloat(item.valor_unitario).toFixed(2)}</td>
                <td>
                    <div class="table-actions">
                        <button class="small" data-action="edit" data-id="${item.id_item}">Editar</button>
                        <button class="small delete" data-action="delete" data-id="${item.id_item}">Excluir</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    async function submitForm(event) {
        event.preventDefault();
        clearStatus();

        const id = document.getElementById("id_item").value;
        const method = id ? "PUT" : "POST";
        const url = id ? `${apiUrl}/${id}` : apiUrl;

        const response = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData())
        });

        if (!response.ok) {
            const error = await response.json();
            const details = error.errors ? Object.values(error.errors).join(" | ") : error.message;
            throw new Error(details);
        }

        await loadItens();
        resetForm();
        setStatus(id ? "Item atualizado com sucesso." : "Item cadastrado com sucesso.");
    }

    async function editItem(id) {
        const response = await fetch(`${apiUrl}/${id}`);
        const item = await response.json();

        document.getElementById("id_item").value = item.id_item;
        document.getElementById("id_ordem").value = item.id_os ?? "";
        document.getElementById("id_servico").value = item.id_servico ?? "";
        document.getElementById("quantidade").value = item.quantidade ?? "";
        document.getElementById("valor_unitario").value = item.valor_unitario ?? "";
        formTitle.textContent = `Editando item #${item.id_item}`;
        setStatus("Item carregado para edicao.");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteItem(id) {
        if (!confirm(`Excluir item ${id}?`)) {
            return;
        }

        const response = await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message);
        }

        await loadItens();
        resetForm();
        setStatus("Item excluido com sucesso.");
    }

    tbody.addEventListener("click", async (event) => {
        const button = event.target.closest("button");
        if (!button) {
            return;
        }

        const { action, id } = button.dataset;

        try {
            if (action === "edit") {
                await editItem(id);
            }

            if (action === "delete") {
                await deleteItem(id);
            }
        } catch (error) {
            setStatus(error.message, "error");
        }
    });

    form.addEventListener("submit", async (event) => {
        try {
            await submitForm(event);
        } catch (error) {
            setStatus(error.message, "error");
        }
    });

    cancelButton.addEventListener("click", resetForm);

    // Carregar dados iniciais
    Promise.all([loadOrdensDeSevico(), loadServicos(), loadItens()]).catch(error => setStatus(error.message, "error"));
</script>
</body>
</html>
