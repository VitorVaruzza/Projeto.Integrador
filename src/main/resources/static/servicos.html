<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Serviços</title>
    <style>
        :root {
            --bg: #f3efe8;
            --surface: rgba(255, 250, 245, 0.92);
            --surface-strong: #fff;
            --ink: #1e293b;
            --accent: #8c2f1b;
            --accent-soft: #d9b7a7;
            --ok: #0f766e;
            --danger: #b42318;
            --line: #ead8c6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(140, 47, 27, 0.07), transparent 25%),
                radial-gradient(circle at right top, rgba(15, 118, 110, 0.12), transparent 30%),
                var(--bg);
            min-height: 100vh;
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 18px 64px;
        }

        .header {
            margin-bottom: 24px;
        }

        .eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .12em;
            font-size: .8rem;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: clamp(2rem, 4vw, 3.3rem);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(320px, 420px) 1fr;
            gap: 22px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(30, 41, 59, 0.08);
            backdrop-filter: blur(8px);
        }

        form {
            display: grid;
            gap: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: .92rem;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface-strong);
            font: inherit;
        }

        input:focus, textarea:focus {
            outline: 2px solid rgba(140, 47, 27, 0.18);
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button[type="submit"] {
            background: var(--accent);
            color: #fff;
        }

        button[type="button"] {
            background: #efe4dc;
            color: var(--ink);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }

        th, td {
            padding: 14px 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        th {
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #5a6572;
        }

        .table-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .small {
            padding: 8px 12px;
            font-size: .88rem;
        }

        .small.delete {
            background: #fee4e2;
            color: var(--danger);
        }

        .status {
            margin-top: 14px;
            min-height: 24px;
            font-weight: 700;
        }

        .status.ok { color: var(--ok); }
        .status.error { color: var(--danger); }

        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }

            th:nth-child(3),
            td:nth-child(3),
            th:nth-child(4),
            td:nth-child(4) {
                display: none;
            }
        }

        .btn-home {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--ink);
            padding: 10px 16px;
            border-radius: 999px;
            text-decoration: none;
            font-size: .88rem;
            font-weight: 700;
            margin-bottom: 24px;
            transition: background .2s ease;
        }

        .btn-home:hover {
            background: var(--accent);
            color: #fff;
        }
    </style>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js" defer></script>
</head>
<body>
<main>
    <a href="/" class="btn-home">← Voltar para o Início</a>
    <button id="theme-toggle" class="btn-home" style="margin-left:8px">Modo Escuro</button>
    <div class="header">
        <div class="eyebrow">Modulo Financeiro</div>
        <h1>Cadastro de serviços</h1>
    </div>

    <section class="layout">
        <article class="panel">
            <h2 id="form-title">Novo serviço</h2>
            <form id="servico-form">
                <input type="hidden" id="id_servico">

                <label>
                    Nome
                    <input id="nome" required maxlength="100">
                </label>

                <label>
                    Descrição
                    <textarea id="descricao" rows="3" maxlength="500"></textarea>
                </label>

                <label>
                    Valor Unitário
                    <input id="valor" type="number" step="0.01" min="0.01" required>
                </label>

                <div class="actions">
                    <button type="submit">Salvar serviço</button>
                    <button type="button" id="cancelar">Limpar formulario</button>
                </div>
            </form>
            <div id="status" class="status"></div>
        </article>

        <article class="panel">
            <h2>Serviços cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Valor Unitário</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody id="servicos-body"></tbody>
            </table>
        </article>
    </section>
</main>

<script>
    const apiUrl = "/api/servicos";
    const form = document.getElementById("servico-form");
    const tbody = document.getElementById("servicos-body");
    const statusBox = document.getElementById("status");
    const formTitle = document.getElementById("form-title");
    const cancelButton = document.getElementById("cancelar");

    function setStatus(message, type = "ok") {
        statusBox.textContent = message;
        statusBox.className = `status ${type}`;
    }

    function clearStatus() {
        statusBox.textContent = "";
        statusBox.className = "status";
    }

    function formData() {
        return {
            nome: document.getElementById("nome").value.trim(),
            descricao: document.getElementById("descricao").value.trim(),
            valor: parseFloat(document.getElementById("valor").value)
        };
    }

    function resetForm() {
        form.reset();
        document.getElementById("id_servico").value = "";
        formTitle.textContent = "Novo serviço";
        clearStatus();
    }

    async function loadServicos() {
        const response = await fetch(apiUrl);
        const servicos = await response.json();

        tbody.innerHTML = "";
        servicos.forEach(servico => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${servico.id_servico}</td>
                <td>${servico.nome}</td>
                <td>R$ ${parseFloat(servico.valor).toFixed(2)}</td>
                <td>
                    <div class="table-actions">
                        <button class="small" data-action="edit" data-id="${servico.id_servico}">Editar</button>
                        <button class="small delete" data-action="delete" data-id="${servico.id_servico}">Excluir</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    async function submitForm(event) {
        event.preventDefault();
        clearStatus();

        const id = document.getElementById("id_servico").value;
        const method = id ? "PUT" : "POST";
        const url = id ? `${apiUrl}/${id}` : apiUrl;

        const response = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData())
        });

        if (!response.ok) {
            const error = await response.json();
            const details = error.errors ? Object.values(error.errors).join(" | ") : error.message;
            throw new Error(details);
        }

        await loadServicos();
        resetForm();
        setStatus(id ? "Serviço atualizado com sucesso." : "Serviço cadastrado com sucesso.");
    }

    async function editServico(id) {
        const response = await fetch(`${apiUrl}/${id}`);
        const servico = await response.json();

        document.getElementById("id_servico").value = servico.id_servico;
        document.getElementById("nome").value = servico.nome ?? "";
        document.getElementById("descricao").value = servico.descricao ?? "";
        document.getElementById("valor").value = servico.valor ?? "";
        formTitle.textContent = `Editando serviço #${servico.id_servico}`;
        setStatus("Serviço carregado para edicao.");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteServico(id) {
        if (!confirm(`Excluir serviço ${id}?`)) {
            return;
        }

        const response = await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message);
        }

        await loadServicos();
        resetForm();
        setStatus("Serviço excluido com sucesso.");
    }

    tbody.addEventListener("click", async (event) => {
        const button = event.target.closest("button");
        if (!button) {
            return;
        }

        const { action, id } = button.dataset;

        try {
            if (action === "edit") {
                await editServico(id);
            }

            if (action === "delete") {
                await deleteServico(id);
            }
        } catch (error) {
            setStatus(error.message, "error");
        }
    });

    form.addEventListener("submit", async (event) => {
        try {
            await submitForm(event);
        } catch (error) {
            setStatus(error.message, "error");
        }
    });

    cancelButton.addEventListener("click", resetForm);

    loadServicos().catch(error => setStatus(error.message, "error"));
</script>
</body>
</html>
