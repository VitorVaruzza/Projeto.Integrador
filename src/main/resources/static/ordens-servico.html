<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>try{var t=localStorage.getItem('theme')||'dark';document.documentElement.classList.add('theme-'+t);}catch(e){}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Ordens de Serviço</title>
    <style>
        :root {
            --bg: #f3efe8;
            --surface: rgba(255, 250, 245, 0.92);
            --surface-strong: #fff;
            --ink: #1e293b;
            --accent: #8c2f1b;
            --accent-soft: #d9b7a7;
            --ok: #0f766e;
            --danger: #b42318;
            --line: #ead8c6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(140, 47, 27, 0.07), transparent 25%),
                radial-gradient(circle at right top, rgba(15, 118, 110, 0.12), transparent 30%),
                var(--bg);
            min-height: 100vh;
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 18px 64px;
        }

        .header {
            margin-bottom: 24px;
        }

        .eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .12em;
            font-size: .8rem;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: clamp(2rem, 4vw, 3.3rem);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(320px, 420px) 1fr;
            gap: 22px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(30, 41, 59, 0.08);
            backdrop-filter: blur(8px);
        }

        form {
            display: grid;
            gap: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: .92rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface-strong);
            font: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid rgba(140, 47, 27, 0.18);
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button[type="submit"] {
            background: var(--accent);
            color: #fff;
        }

        button[type="button"] {
            background: #efe4dc;
            color: var(--ink);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }

        th, td {
            padding: 14px 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        th {
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #5a6572;
        }

        .table-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .small {
            padding: 8px 12px;
            font-size: .88rem;
        }

        .small.delete {
            background: #fee4e2;
            color: var(--danger);
        }

        .status {
            margin-top: 14px;
            min-height: 24px;
            font-weight: 700;
        }

        .status.ok { color: var(--ok); }
        .status.error { color: var(--danger); }

        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }

            th:nth-child(4),
            td:nth-child(4),
            th:nth-child(5),
            td:nth-child(5) {
                display: none;
            }
        }

        .btn-home {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--ink);
            padding: 10px 16px;
            border-radius: 999px;
            text-decoration: none;
            font-size: .88rem;
            font-weight: 700;
            margin-bottom: 24px;
            transition: background .2s ease;
        }

        .btn-home:hover {
            background: var(--accent);
            color: #fff;
        }
    </style>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js" defer></script>
</head>
<body>
<main>
    <a href="/" class="btn-home">←Voltar para o Início</a>
    <button id="theme-toggle" class="btn-home" style="margin-left:8px">Modo Escuro</button>
    <div class="header">
        <div class="eyebrow">Modulo Financeiro</div>
        <h1>Cadastro de ordens de serviço</h1>
    </div>

    <section class="layout">
        <article class="panel">
            <h2 id="form-title">Nova ordem de serviço</h2>
            <form id="ordem-form">
                <input type="hidden" id="id_ordem">

                <label>
                    Cliente (Opcional)
                    <select id="id_cliente">
                        <option value="">Selecione um cliente...</option>
                    </select>
                </label>

                <label>
                    Veículo
                    <select id="id_veiculo" required>
                        <option value="">Selecione um veículo...</option>
                    </select>
                </label>

                <label>
                    Data Abertura
                    <input id="data_abertura" type="date" required>
                </label>

                <label>
                    Data Fechamento
                    <input id="data_fechamento" type="date">
                </label>

                <label>
                    Status
                    <select id="status" required>
                        <option value="aberta">Aberta</option>
                        <option value="em_andamento">Em Andamento</option>
                        <option value="concluida">Concluida</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </label>

                <label>
                    Observações
                    <textarea id="observacoes" rows="3" maxlength="500"></textarea>
                </label>

                <div class="actions">
                    <button type="submit">Salvar ordem</button>
                    <button type="button" id="cancelar">Limpar formulario</button>
                </div>
            </form>
            <div id="status-message" class="status"></div>
        </article>

        <article class="panel">
            <h2>Ordens cadastradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Veiculo</th>
                        <th>Data Abertura</th>
                        <th>Status</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody id="ordens-body"></tbody>
            </table>
        </article>
    </section>
</main>

<script>
    const apiUrl = "/api/ordens-servico";
    const form = document.getElementById("ordem-form");
    const tbody = document.getElementById("ordens-body");
    const statusBox = document.getElementById("status-message");
    const formTitle = document.getElementById("form-title");
    const cancelButton = document.getElementById("cancelar");

    function setStatus(message, type = "ok") {
        statusBox.textContent = message;
        statusBox.className = `status ${type}`;
    }

    function clearStatus() {
        statusBox.textContent = "";
        statusBox.className = "status";
    }

    function formData() {
        const idClienteValue = document.getElementById("id_cliente").value;
        const idVeiculoValue = document.getElementById("id_veiculo").value;
        const dataAberturaValue = document.getElementById("data_abertura").value;
        const statusValue = document.getElementById("status").value;

        // Validar campos obrigatórios
        if (!idVeiculoValue) {
            throw new Error("Veículo é obrigatório!");
        }
        if (!dataAberturaValue) {
            throw new Error("Data de abertura é obrigatória!");
        }
        if (!statusValue) {
            throw new Error("Status é obrigatório!");
        }

        return {
            id_cliente: idClienteValue ? parseInt(idClienteValue) : null,
            id_veiculo: parseInt(idVeiculoValue),
            data_abertura: dataAberturaValue,
            data_fechamento: document.getElementById("data_fechamento").value || null,
            status: statusValue,
            observacoes: document.getElementById("observacoes").value.trim()
        };
    }

    function resetForm() {
        form.reset();
        document.getElementById("id_ordem").value = "";
        formTitle.textContent = "Nova ordem de serviço";
        document.getElementById("status").value = "aberta";
        clearStatus();
    }

    async function loadClientes() {
        try {
            const response = await fetch("/api/clientes");
            const clientes = await response.json();
            const select = document.getElementById("id_cliente");

            // Limpar opções anteriores mantendo a primeira
            while (select.options.length > 1) {
                select.remove(1);
            }

            // Adicionar clientes como opções
            clientes.forEach(cliente => {
                const option = document.createElement("option");
                option.value = cliente.id_cliente;
                option.textContent = `${cliente.id_cliente} - ${cliente.nome}`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("Erro ao carregar clientes:", error);
        }
    }

    async function loadVeiculos() {
        try {
            const response = await fetch("/api/veiculos");
            const veiculos = await response.json();
            const select = document.getElementById("id_veiculo");

            // Limpar opções anteriores mantendo a primeira
            while (select.options.length > 1) {
                select.remove(1);
            }

            // Adicionar veículos como opções
            veiculos.forEach(veiculo => {
                const option = document.createElement("option");
                option.value = veiculo.id_veiculo;
                option.textContent = `${veiculo.id_veiculo} - ${veiculo.placa} (${veiculo.modelo})`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("Erro ao carregar veículos:", error);
        }
    }

    async function loadOrdens() {
        const response = await fetch(apiUrl);
        const ordens = await response.json();

        tbody.innerHTML = "";
        ordens.forEach(ordem => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${ordem.id_os}</td>
                <td>${ordem.id_cliente}</td>
                <td>${ordem.id_veiculo}</td>
                <td>${ordem.data_abertura ?? ""}</td>
                <td>${ordem.status ?? ""}</td>
                <td>
                    <div class="table-actions">
                        <button class="small" data-action="edit" data-id="${ordem.id_os}">Editar</button>
                        <button class="small delete" data-action="delete" data-id="${ordem.id_os}">Excluir</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    async function submitForm(event) {
        event.preventDefault();
        clearStatus();

        const id = document.getElementById("id_ordem").value;
        const method = id ? "PUT" : "POST";
        const url = id ? `${apiUrl}/${id}` : apiUrl;
        const data = formData();

        console.log("Enviando OS:", {
            metodo: method,
            url: url,
            dados: data
        });

        try {
            const response = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            console.log("Resposta status:", response.status);

            if (!response.ok) {
                const error = await response.json();
                console.log("Erro na resposta:", error);
                const details = error.errors ? Object.values(error.errors).join(" | ") : error.message;
                throw new Error(details);
            }

            const result = await response.json();
            console.log("Sucesso:", result);

            await loadOrdens();
            resetForm();
            setStatus(id ? "Ordem atualizada com sucesso." : "Ordem cadastrada com sucesso.");
        } catch (error) {
            console.error("Erro capturado:", error);
            throw error;
        }
    }

    async function editOrdem(id) {
        const response = await fetch(`${apiUrl}/${id}`);
        const ordem = await response.json();

        document.getElementById("id_ordem").value = ordem.id_os;
        document.getElementById("id_cliente").value = ordem.id_cliente ?? "";
        document.getElementById("id_veiculo").value = ordem.id_veiculo ?? "";
        document.getElementById("data_abertura").value = ordem.data_abertura ?? "";
        document.getElementById("data_fechamento").value = ordem.data_fechamento ?? "";
        document.getElementById("status").value = ordem.status ?? "aberta";
        document.getElementById("observacoes").value = ordem.observacoes ?? "";
        formTitle.textContent = `Editando ordem #${ordem.id_os}`;
        setStatus("Ordem carregada para edicao.");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteOrdem(id) {
        if (!confirm(`Excluir ordem ${id}?`)) {
            return;
        }

        const response = await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message);
        }

        await loadOrdens();
        resetForm();
        setStatus("Ordem excluida com sucesso.");
    }

    tbody.addEventListener("click", async (event) => {
        const button = event.target.closest("button");
        if (!button) {
            return;
        }

        const { action, id } = button.dataset;

        try {
            if (action === "edit") {
                await editOrdem(id);
            }

            if (action === "delete") {
                await deleteOrdem(id);
            }
        } catch (error) {
            setStatus(error.message, "error");
        }
    });

    form.addEventListener("submit", async (event) => {
        try {
            await submitForm(event);
        } catch (error) {
            console.error("Erro na submissão:", error);
            setStatus(error.message, "error");
        }
    });

    cancelButton.addEventListener("click", resetForm);

    // Função de teste da API
    async function testApiConnection() {
        try {
            console.log("Testando conexão com API...");

            // Testar conexão com clientes
            const clientesResp = await fetch("/api/clientes");
            console.log("Clientes - Status:", clientesResp.status);

            // Testar conexão com veículos
            const veiculosResp = await fetch("/api/veiculos");
            console.log("Veículos - Status:", veiculosResp.status);

            // Testar conexão com ordens
            const ordensResp = await fetch("/api/ordens-servico");
            console.log("Ordens - Status:", ordensResp.status);

            console.log("✅ API conectada com sucesso!");
        } catch (error) {
            console.error("❌ Erro de conexão:", error);
        }
    }

    // Carregar dados iniciais
    Promise.all([loadClientes(), loadVeiculos(), loadOrdens()])
        .then(() => {
            console.log("✅ Dados carregados com sucesso!");
            testApiConnection();
        })
        .catch(error => {
            console.error("❌ Erro ao carregar dados:", error);
            setStatus(error.message, "error");
        });
</script>
</body>
</html>
