<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>try{var t=localStorage.getItem('theme')||'dark';document.documentElement.classList.add('theme-'+t);}catch(e){}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Veículos</title>
    <style>
        :root {
            --bg: #f3efe8;
            --surface: rgba(255, 250, 245, 0.92);
            --surface-strong: #fff;
            --ink: #1e293b;
            --accent: #8c2f1b;
            --accent-soft: #d9b7a7;
            --ok: #0f766e;
            --danger: #b42318;
            --line: #ead8c6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(140, 47, 27, 0.07), transparent 25%),
                radial-gradient(circle at right top, rgba(15, 118, 110, 0.12), transparent 30%),
                var(--bg);
            min-height: 100vh;
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 18px 64px;
        }

        .header {
            margin-bottom: 24px;
        }

        .eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .12em;
            font-size: .8rem;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: clamp(2rem, 4vw, 3.3rem);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(320px, 420px) 1fr;
            gap: 22px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(30, 41, 59, 0.08);
            backdrop-filter: blur(8px);
        }

        form {
            display: grid;
            gap: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: .92rem;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface-strong);
            font: inherit;
        }

        input:focus {
            outline: 2px solid rgba(140, 47, 27, 0.18);
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button[type="submit"] {
            background: var(--accent);
            color: #fff;
        }

        button[type="button"] {
            background: #efe4dc;
            color: var(--ink);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }

        th, td {
            padding: 14px 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        th {
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #5a6572;
        }

        .table-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .small {
            padding: 8px 12px;
            font-size: .88rem;
        }

        .small.delete {
            background: #fee4e2;
            color: var(--danger);
        }

        .status {
            margin-top: 14px;
            min-height: 24px;
            font-weight: 700;
        }

        .status.ok { color: var(--ok); }
        .status.error { color: var(--danger); }

        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }

            th:nth-child(4),
            td:nth-child(4),
            th:nth-child(5),
            td:nth-child(5) {
                display: none;
            }
        }

        .btn-home {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--ink);
            padding: 10px 16px;
            border-radius: 999px;
            text-decoration: none;
            font-size: .88rem;
            font-weight: 700;
            margin-bottom: 24px;
            transition: background .2s ease;
        }

        .btn-home:hover {
            background: var(--accent);
            color: #fff;
        }
    </style>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js" defer></script>
</head>
<body>
<main>
    <a href="/" class="btn-home">← Voltar para o Início</a>
    <button id="theme-toggle" class="btn-home" style="margin-left:8px">Modo Escuro</button>
    <div class="header">
        <div class="eyebrow">Modulo Financeiro</div>
        <h1>Cadastro de veículos</h1>
    </div>

    <section class="layout">
        <article class="panel">
            <h2 id="form-title">Novo veículo</h2>
            <form id="veiculo-form">
                <input type="hidden" id="id_veiculo">

                <label>
                    Placa
                    <input id="placa" required maxlength="10">
                </label>

                <label>
                    Marca
                    <input id="marca" required maxlength="50">
                </label>

                <label>
                    Modelo
                    <input id="modelo" required maxlength="50">
                </label>

                <label>
                    Ano
                    <input id="ano" type="number" min="1886" required>
                </label>

                <label>
                    Cor
                    <input id="cor" maxlength="30">
                </label>

                <label>
                    Chassi
                    <input id="chassi" maxlength="50">
                </label>

                <label>
                    Cliente
                    <select id="id_cliente" required>
                        <option value="">Selecione um cliente...</option>
                    </select>
                </label>

                <div class="actions">
                    <button type="submit">Salvar veículo</button>
                    <button type="button" id="cancelar">Limpar formulario</button>
                </div>
            </form>
            <div id="status" class="status"></div>
        </article>

        <article class="panel">
            <h2>Veículos cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Placa</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Ano</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody id="veiculos-body"></tbody>
            </table>
        </article>
    </section>
</main>

<script>
    const apiUrl = "/api/veiculos";
    const form = document.getElementById("veiculo-form");
    const tbody = document.getElementById("veiculos-body");
    const statusBox = document.getElementById("status");
    const formTitle = document.getElementById("form-title");
    const cancelButton = document.getElementById("cancelar");

    function setStatus(message, type = "ok") {
        statusBox.textContent = message;
        statusBox.className = `status ${type}`;
    }

    function clearStatus() {
        statusBox.textContent = "";
        statusBox.className = "status";
    }

    function formData() {
        return {
            placa: document.getElementById("placa").value.trim(),
            marca: document.getElementById("marca").value.trim(),
            modelo: document.getElementById("modelo").value.trim(),
            ano: parseInt(document.getElementById("ano").value),
            cor: document.getElementById("cor").value.trim(),
            chassi: document.getElementById("chassi").value.trim(),
            id_cliente: parseInt(document.getElementById("id_cliente").value)
        };
    }

    function resetForm() {
        form.reset();
        document.getElementById("id_veiculo").value = "";
        formTitle.textContent = "Novo veículo";
        clearStatus();
    }

    async function loadClientesVeiculos() {
        try {
            const response = await fetch("/api/clientes");
            const clientes = await response.json();
            const select = document.getElementById("id_cliente");

            // Limpar opções anteriores mantendo a primeira
            while (select.options.length > 1) {
                select.remove(1);
            }

            // Adicionar clientes como opções
            clientes.forEach(cliente => {
                const option = document.createElement("option");
                option.value = cliente.id_cliente;
                option.textContent = `${cliente.id_cliente} - ${cliente.nome}`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("Erro ao carregar clientes:", error);
        }
    }

    async function loadVeiculos() {
        const response = await fetch(apiUrl);
        const veiculos = await response.json();

        tbody.innerHTML = "";
        veiculos.forEach(veiculo => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${veiculo.id_veiculo}</td>
                <td>${veiculo.placa}</td>
                <td>${veiculo.marca}</td>
                <td>${veiculo.modelo}</td>
                <td>${veiculo.ano}</td>
                <td>
                    <div class="table-actions">
                        <button class="small" data-action="edit" data-id="${veiculo.id_veiculo}">Editar</button>
                        <button class="small delete" data-action="delete" data-id="${veiculo.id_veiculo}">Excluir</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    async function submitForm(event) {
        event.preventDefault();
        clearStatus();

        const id = document.getElementById("id_veiculo").value;
        const method = id ? "PUT" : "POST";
        const url = id ? `${apiUrl}/${id}` : apiUrl;

        const response = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData())
        });

        if (!response.ok) {
            const error = await response.json();
            const details = error.errors ? Object.values(error.errors).join(" | ") : error.message;
            throw new Error(details);
        }

        await loadVeiculos();
        resetForm();
        setStatus(id ? "Veículo atualizado com sucesso." : "Veículo cadastrado com sucesso.");
    }

    async function editVeiculo(id) {
        const response = await fetch(`${apiUrl}/${id}`);
        const veiculo = await response.json();

        document.getElementById("id_veiculo").value = veiculo.id_veiculo;
        document.getElementById("placa").value = veiculo.placa ?? "";
        document.getElementById("marca").value = veiculo.marca ?? "";
        document.getElementById("modelo").value = veiculo.modelo ?? "";
        document.getElementById("ano").value = veiculo.ano ?? "";
        document.getElementById("cor").value = veiculo.cor ?? "";
        document.getElementById("chassi").value = veiculo.chassi ?? "";
        document.getElementById("id_cliente").value = veiculo.id_cliente ?? "";
        formTitle.textContent = `Editando veículo #${veiculo.id_veiculo}`;
        setStatus("Veículo carregado para edicao.");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteVeiculo(id) {
        if (!confirm(`Excluir veículo ${id}?`)) {
            return;
        }

        const response = await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message);
        }

        await loadVeiculos();
        resetForm();
        setStatus("Veículo excluido com sucesso.");
    }

    tbody.addEventListener("click", async (event) => {
        const button = event.target.closest("button");
        if (!button) {
            return;
        }

        const { action, id } = button.dataset;

        try {
            if (action === "edit") {
                await editVeiculo(id);
            }

            if (action === "delete") {
                await deleteVeiculo(id);
            }
        } catch (error) {
            setStatus(error.message, "error");
        }
    });

    form.addEventListener("submit", async (event) => {
        try {
            await submitForm(event);
        } catch (error) {
            setStatus(error.message, "error");
        }
    });

    cancelButton.addEventListener("click", resetForm);

    // Carregar dados iniciais
    Promise.all([loadClientesVeiculos(), loadVeiculos()]).catch(error => setStatus(error.message, "error"));
</script>
</body>
</html>
